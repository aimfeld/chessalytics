name: CI

"on":
  pull_request:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production after tests pass"
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # No POSTGRES_DB: the suite clones its own per-run / per-worker test
          # database from a migrated template at runtime (tests/conftest.py),
          # connecting via the always-present `postgres` maintenance DB.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        # Include the isolated maia-inference group (onnxruntime/numpy) so ty can
        # resolve app/services/maia_engine.py's deferred imports (Phase 174). The
        # group is kept out of [project.dependencies] for the lean worker image
        # (Dockerfile.worker), but CI type-checks and tests the backend, which the
        # backend Dockerfile builds with this same group.
        run: uv sync --locked --group maia-inference

      - name: Zone drift check
        run: |
          uv run python scripts/gen_endgame_zones_ts.py
          git diff --exit-code frontend/src/generated/endgameZones.ts

      - name: Flaw thresholds drift check
        run: |
          uv run python scripts/gen_flaw_thresholds_ts.py
          git diff --exit-code frontend/src/generated/flawThresholds.ts

      - name: Bot strength curves drift check
        run: |
          uv run python scripts/gen_bot_strength_curves.py
          git diff --exit-code frontend/src/generated/botStrengthCurves.ts reports/data/bot-strength-lookup.json

      - name: Persona calibration drift check
        run: |
          uv run python scripts/gen_persona_calibration.py
          git diff --exit-code frontend/src/generated/personaCalibration.ts reports/data/persona-calibration.json

      - name: Python vulnerability scan (pip-audit)
        # CVE-2026-3219 is in pip itself, pulled transitively by `--with pip-audit`.
        # Not a project runtime dependency and no fix version exists yet. Revisit when upstream ships a fix.
        #
        # PYSEC-2025-183 / CVE-2025-45768 is a vendor-disputed "weak encryption" report against pyjwt
        # (all versions through 2.12.1; transitive via fastapi-users). The pyjwt maintainer disputes
        # the classification because key length is chosen by the consuming application; no fix version
        # exists upstream. FlawChess generates JWTs through fastapi-users with the standard
        # SECRET_KEY from env, which is a high-entropy random string — not the weak-key scenario the
        # CVE flags. Revisit if upstream publishes a fix or new guidance.
        run: uv run --with pip-audit pip-audit --strict --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2025-183

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check app/ tests/

      - name: Type check (ty)
        run: uv run ty check app/ tests/ scripts/

      - name: Install Stockfish (for engine wrapper tests)
        # Mirrors Dockerfile: download pinned sf_18 binary from GitHub releases instead of
        # apt-get (which is ~24s slower and pulls Stockfish 16, drifting from prod's sf_18).
        env:
          STOCKFISH_TAG: sf_18
          STOCKFISH_ASSET: stockfish-ubuntu-x86-64-avx2
          STOCKFISH_SHA256: 536c0c2c0cf06450df0bfb5e876ef0d3119950703a8f143627f990c7b5417964
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/official-stockfish/Stockfish/releases/download/${STOCKFISH_TAG}/${STOCKFISH_ASSET}.tar" -o /tmp/stockfish.tar
          echo "${STOCKFISH_SHA256}  /tmp/stockfish.tar" | sha256sum -c -
          tar -xf /tmp/stockfish.tar -C /tmp
          sudo mv "/tmp/stockfish/${STOCKFISH_ASSET}" /usr/local/bin/stockfish
          sudo chmod +x /usr/local/bin/stockfish
          rm -rf /tmp/stockfish.tar /tmp/stockfish
          stockfish --help | head -3
          echo "STOCKFISH_PATH=/usr/local/bin/stockfish" >> "$GITHUB_ENV"

      - name: Run pytest
        env:
          DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/flawchess_test
        run: uv run pytest

      - name: Tagger precision gate
        run: uv run pytest tests/scripts/tagger -v

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend vulnerability scan (audit-ci)
        # audit-ci wraps `npm audit` with a justified per-advisory allowlist
        # (frontend/audit-ci.jsonc): fails on any high/critical prod-dep vuln
        # except explicitly accepted, non-applicable ones. Keeps the gate strict.
        run: npx audit-ci --config audit-ci.jsonc
        working-directory: frontend

      - name: Lint (eslint)
        run: npm run lint
        working-directory: frontend

      - name: Type check and build (tsc + vite)
        run: npm run build
        working-directory: frontend

      - name: Run tests (vitest)
        run: npm test
        working-directory: frontend

      - name: No COOP/COEP header guard + WASM MIME check
        run: |
          npm run preview -- --port 4173 &
          PREVIEW_PID=$!
          sleep 3

          FAIL=0

          PAGE_HEADERS=$(curl -sf -I http://localhost:4173/ 2>&1)
          echo "Page headers:"
          echo "$PAGE_HEADERS"
          if echo "$PAGE_HEADERS" | grep -qi 'cross-origin-opener-policy\|cross-origin-embedder-policy'; then
            echo "FAIL: COOP/COEP header found on page — breaks Google OAuth and iOS Safari"
            FAIL=1
          else
            echo "PASS: No COOP/COEP headers on page"
          fi

          WASM_HEADERS=$(curl -sf -I http://localhost:4173/engine/stockfish-18-lite-single.wasm 2>&1)
          echo "WASM headers:"
          echo "$WASM_HEADERS"
          if echo "$WASM_HEADERS" | grep -qi 'content-type.*application/wasm'; then
            echo "PASS: WASM MIME type is application/wasm"
          else
            echo "FAIL: WASM MIME type incorrect (expected application/wasm)"
            FAIL=1
          fi

          kill "$PREVIEW_PID" 2>/dev/null || true
          exit $FAIL
        working-directory: frontend

      - name: Dead code check (knip)
        run: npm run knip
        working-directory: frontend

      - name: Build image for vulnerability scan
        run: docker build -t flawchess:ci .

      - name: Container vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flawchess:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/production' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/flawchess

            # Fail fast if working tree is dirty — never auto-resolve
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: Working tree has uncommitted changes — aborting deploy"
              git status --short
              exit 1
            fi

            # GitLab Flow: prod tracks the `production` branch, never `main`.
            # checkout handles the one-time switch from the old `main` checkout;
            # reset --hard guarantees the working tree matches origin/production
            # exactly (the dirty-tree guard above already aborted on local edits).
            git fetch origin --prune
            git checkout production 2>/dev/null || git checkout -b production origin/production
            git reset --hard origin/production

            # Verify the expected commit arrived
            echo "Deployed commit: $(git log --oneline -1)"

            docker compose build --no-cache backend caddy
            docker compose up -d

      - name: Health check
        run: |
          for i in $(seq 1 36); do
            if curl -sf https://flawchess.com/api/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/36 failed, waiting 5s..."
            sleep 5
          done
          echo "Health check failed after 180s"
          exit 1
