name: Deploy data stories to GitHub Pages

# Publishes the stories/ directory (public data stories) to
# https://stories.flawchess.com/ whenever it changes on main.
# Source of truth lives on main; there is no gh-pages branch.

on:
  push:
    branches: [main]
    paths:
      - "stories/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: stories
      - id: deployment
        uses: actions/deploy-pages@v5
