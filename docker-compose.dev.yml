# Local development database only
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:18-alpine
    # Come back automatically after a reboot or a Docker daemon restart. Without
    # this the container stays Exited and the next thing to touch :5432 fails
    # with a bare ConnectionRefusedError. Does NOT survive `compose down` --
    # that removes the container outright, restart policy or not.
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    # Docker's 64 MB /dev/shm default is exhausted by parallel-query DSM
    # segments and surfaces as a MISLEADING "No space left on device" /
    # asyncpg.DiskFullError while the volume has hundreds of GB free. This is a
    # Docker option, NOT a Postgres flag; benchmark and prod carry the same
    # 256m for the same reason. A bare `docker compose restart db` does NOT
    # apply a changed shm_size -- the container must be recreated.
    shm_size: "256m"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Pin PGDATA to the conventional path. The postgres:18 image defaults to
      # /var/lib/postgresql/18/docker, which would NOT be on the named volume
      # below, so data would silently live in the container's writable layer
      # and be lost on `docker compose down`. Keep this aligned with the volume
      # mount path.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - devpgdata:/var/lib/postgresql/data
      - ./deploy/init-dev-db.sql:/docker-entrypoint-initdb.d/init-dev-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  devpgdata:
